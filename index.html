<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121512" />
    <meta name="description" content="A calmer habit tracker with custom schedules, focus sessions, daily reflections, and a better plan for tomorrow." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daymark" />
    <title>Daymark — Make today count</title>
    <link rel="icon" type="image/svg+xml" href="daymark-icon.svg" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
    <script src="pwa.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main sidebar">
        <div class="sidebar-head">
          <a class="brand" href="#today" aria-label="Daymark home" data-view="today">
            <span class="brand-mark" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </span>
            <span class="brand-name">daymark<span>.</span></span>
          </a>
          <button class="sidebar-collapse-toggle" type="button" data-action="toggle-sidebar" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true" aria-controls="main-navigation"><span data-icon="chevron" aria-hidden="true"></span></button>
        </div>

        <p class="workspace-label">YOUR SPACE</p>

        <nav class="main-nav" id="main-navigation" aria-label="Main navigation">
          <button class="nav-link is-active" type="button" data-view="today" aria-label="Today" title="Today" aria-current="page">
            <span class="nav-icon" aria-hidden="true" data-icon="grid"></span>
            <span>Today</span>
            <span class="nav-indicator" aria-hidden="true"></span>
          </button>
          <button class="nav-link" type="button" data-view="habits" aria-label="Habits" title="Habits">
            <span class="nav-icon" aria-hidden="true" data-icon="checklist"></span>
            <span>Habits</span>
          </button>
          <button class="nav-link" type="button" data-view="planner" aria-label="Planner" title="Planner">
            <span class="nav-icon" aria-hidden="true" data-icon="calendar"></span>
            <span>Planner</span>
          </button>
          <button class="nav-link" type="button" data-view="challenges" aria-label="Challenges" title="Challenges">
            <span class="nav-icon" aria-hidden="true" data-icon="flag"></span>
            <span>Challenges</span>
          </button>
          <button class="nav-link" type="button" data-view="insights" aria-label="Insights" title="Insights">
            <span class="nav-icon" aria-hidden="true" data-icon="chart"></span>
            <span>Insights</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>

        <button class="sidebar-challenge" type="button" data-view="challenges" aria-label="View your active challenge">
          <span class="sidebar-challenge-top">
            <span class="sidebar-challenge-label">IN PROGRESS</span>
            <span class="sidebar-challenge-spark" data-icon="sparkles" aria-hidden="true"></span>
          </span>
          <span class="sidebar-challenge-name" id="sidebar-challenge-name">Everyday Momentum</span>
          <span class="sidebar-progress-track"><span id="sidebar-progress-fill"></span></span>
          <span class="sidebar-challenge-bottom">
            <span id="sidebar-challenge-day">Day 1 of 30</span>
            <span id="sidebar-challenge-checkins">0 check-ins</span>
          </span>
        </button>

        <div class="sidebar-bottom">
          <button class="nav-link settings-link" type="button" data-view="settings" aria-label="Settings" title="Settings">
            <span class="nav-icon" aria-hidden="true" data-icon="settings"></span>
            <span>Settings</span>
          </button>
          <button class="profile-button" type="button" data-view="settings" aria-label="Open your settings">
            <span class="profile-avatar" id="profile-avatar">D</span>
            <span class="profile-copy">
              <strong id="profile-name">Your space</strong>
              <small>Private tracker</small>
            </span>
            <span class="profile-caret" data-icon="chevron" aria-hidden="true"></span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb" aria-label="Current page">
            <span class="breadcrumb-root">Workspace</span>
            <span class="breadcrumb-slash" aria-hidden="true">/</span>
            <strong id="breadcrumb-current">Today</strong>
          </div>
          <div class="topbar-actions">
            <span class="top-date" id="top-date"></span>
            <span class="topbar-divider" aria-hidden="true"></span>
            <button class="button button-secondary button-small install-app-button" id="install-app-button" type="button" aria-label="Install Daymark on this device" title="Install Daymark" hidden>
              <span data-icon="download" aria-hidden="true"></span>
              <span>Install</span>
            </button>
            <button class="button button-primary button-small" type="button" data-action="add-habit" aria-label="Add a habit" title="Add a habit">
              <span data-icon="plus" aria-hidden="true"></span>
              <span>Add habit</span>
            </button>
          </div>
        </header>

        <div class="page-container" id="page-container" tabindex="-1">
          <div id="app-content"></div>
        </div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div class="toast-host" id="toast-host" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
